<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta | Panel interno LifeBag</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1f4438;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 24px;
    max-width: 440px;
    width: 100%;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .logo {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    margin-bottom: 20px;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    color: #1f4438;
    font-size: 28px;
    margin: 0 0 8px;
  }
  p.subtitle {
    color: #b98a4e;
    font-size: 14px;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  .msg {
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
    text-align: left;
  }
  .msg.error { background: #fbe2df; color: #a5433a; display: block; }
  .msg.success { background: #dcefe3; color: #1f6b45; display: block; }
  label {
    display: block;
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    color: #1f4438;
    margin: 16px 0 6px;
  }
  input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #e4e0d8;
    background: #f4f1ea;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: #b98a4e; }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    border: none;
    border-radius: 999px;
    background: #1f4438;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .back {
    display: inline-block;
    margin-top: 20px;
    color: #b98a4e;
    font-size: 13px;
    text-decoration: none;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Crear cuenta</h1>
    <p class="subtitle">Registrate con tu correo. Un administrador va a revisar y aprobar tu acceso antes de que puedas ingresar.</p>

    <div id="msg" class="msg"></div>

    <form id="form-registro">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" required placeholder="tu@correo.com">

      <label for="pass">Contraseña</label>
      <input type="password" id="pass" required minlength="6" placeholder="Mínimo 6 caracteres">

      <label for="pass2">Repetir contraseña</label>
      <input type="password" id="pass2" required minlength="6" placeholder="Repetí la contraseña">

      <button type="submit" id="btn-registro">Crear cuenta</button>
    </form>

    <a class="back" href="login.html">← Volver a ingresar</a>
  </div>

  <!-- Firebase SDK (compat, sin build tools) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <script>
    // Usá la misma config que ya tenés en login.html
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_PROYECTO.firebaseapp.com",
      projectId: "TU_PROYECTO",
      storageBucket: "TU_PROYECTO.appspot.com",
      messagingSenderId: "TU_SENDER_ID",
      appId: "TU_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const form = document.getElementById('form-registro');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn-registro');

    function mostrarMensaje(texto, tipo) {
      msg.textContent = texto;
      msg.className = 'msg ' + tipo;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value;
      const pass2 = document.getElementById('pass2').value;

      if (pass !== pass2) {
        mostrarMensaje('Las contraseñas no coinciden.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creando cuenta...';

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);

        // Guardamos el estado "pendiente" en Firestore
        await db.collection('usuarios').doc(cred.user.uid).set({
          email: email,
          estado: 'pendiente',           // pendiente | aprobado | rechazado
          rol: 'usuario',
          creadoEn: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Cerramos la sesión: no puede usar el panel hasta ser aprobado
        await auth.signOut();

        mostrarMensaje('¡Listo! Tu cuenta fue creada. Un administrador la va a revisar antes de que puedas ingresar.', 'success');
        form.reset();
      } catch (err) {
        let texto = 'No se pudo crear la cuenta. Probá de nuevo.';
        if (err.code === 'auth/email-already-in-use') texto = 'Ese correo ya tiene una cuenta.';
        if (err.code === 'auth/invalid-email') texto = 'El correo no es válido.';
        if (err.code === 'auth/weak-password') texto = 'La contraseña es muy débil.';
        mostrarMensaje(texto, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crear cuenta';
      }
    });
  </script>

</body>
</html>
