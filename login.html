<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar | Panel Life Bag</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--cream:#f6f1e6; --forest:#1b4332; --forest-deep:#0f2a1f;
--rescue:#c1442c; --rescue-deep:#a8371f; --border:#e4dcc6;
--text:#23291f; --text-muted:#5c6355; --surface:#ffffff;
--radius-lg:26px; --radius-sm:10px; --shadow:0 18px 40px -18px rgba(15,42,31,0.28);
}
*{box-sizing:border-box; margin:0; padding:0; font-family:'Plus Jakarta Sans', sans-serif;}
body{
min-height:100vh; background:var(--forest);
background-image:radial-gradient(circle at 15% 15%, rgba(255,255,255,0.06), transparent 45%),
radial-gradient(circle at 85% 85%, rgba(255,255,255,0.05), transparent 45%);
display:flex; align-items:center; justify-content:center; padding:1.5rem; color:var(--text);
}
.card{
background:var(--surface); width:100%; max-width:380px;
border-radius:var(--radius-lg); padding:2.2rem 1.8rem; box-shadow:var(--shadow);
text-align:center;
}
.card img{height:56px; width:56px; margin:0 auto 0.8rem;}
h1{font-family:'Fraunces', serif; font-size:1.4rem; color:var(--forest); font-weight:700;}
p.sub{color:var(--text-muted); font-size:0.85rem; margin-top:0.35rem; margin-bottom:1.6rem;}
.form-group{margin-bottom:1rem; text-align:left;}
label{display:block; font-size:0.78rem; font-weight:700; margin-bottom:6px; color:var(--forest-deep);}
input{
width:100%; padding:0.8rem 1rem; border-radius:var(--radius-sm);
border:1.5px solid var(--border); font-size:0.94rem; outline:none;
background:var(--cream); transition:all 0.2s ease;
}
input:focus{border-color:var(--forest); background:#fff; box-shadow:0 0 0 3px rgba(27,67,50,0.12);}
button{
width:100%; background:var(--forest); color:#fff; border:none;
padding:0.9rem; border-radius:50px; font-size:0.94rem; font-weight:700;
cursor:pointer; margin-top:0.5rem; transition:background 0.2s;
}
button:hover{background:var(--forest-deep);}
button:disabled{opacity:0.65; cursor:not-allowed;}
.google-btn{
background:#fff; color:var(--forest-deep); border:1.5px solid var(--border);
display:flex; align-items:center; justify-content:center; gap:0.6rem;
}
.google-btn:hover{background:var(--cream);}
.google-btn img{height:18px; width:18px; margin:0;}
.divider{
display:flex; align-items:center; gap:0.7rem; margin:1.2rem 0;
color:var(--text-muted); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.04em;
}
.divider::before, .divider::after{content:""; flex:1; height:1px; background:var(--border);}
.error{
display:none; background:#fbe6e2; color:var(--rescue-deep); font-size:0.8rem;
padding:0.65rem 0.85rem; border-radius:var(--radius-sm); margin-bottom:1rem; font-weight:600; text-align:left;
}
.error a{color:var(--rescue-deep); text-decoration:underline;}
.info{
display:none; background:#e5efe8; color:var(--forest-deep); font-size:0.8rem;
padding:0.65rem 0.85rem; border-radius:var(--radius-sm); margin-bottom:1rem; font-weight:600; text-align:left;
}
.back{display:inline-block; margin-top:1.4rem; font-size:0.8rem; color:var(--text-muted); text-decoration:none;}
.back:hover{color:var(--forest);}
.crear-cuenta{display:block; margin-top:0.6rem; font-size:0.8rem; color:var(--forest); text-decoration:none; font-weight:700;}
.crear-cuenta:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="card">
<img src="assets/logo.png" alt="Life Bag">
<h1>Panel interno</h1>
<p class="sub">Ingresá con tu cuenta para ver pedidos y producción.</p>

<div class="error" id="errorMsg"></div>
<div class="info" id="infoMsg"></div>

<button type="button" id="googleBtn" class="google-btn">
<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
Ingresar con Google
</button>

<div class="divider">o con tu correo</div>

<form id="loginForm">
<div class="form-group">
<label for="email">Correo electrónico</label>
<input type="email" id="email" placeholder="admin@lifebag.com" required autocomplete="username">
</div>
<div class="form-group">
<label for="password">Contraseña</label>
<input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
</div>
<button type="submit" id="loginBtn">Ingresar</button>
</form>

<a href="registro.html" class="crear-cuenta">¿No tenés cuenta? Registrate acá</a>
<a href="index.html" class="back">← Volver al sitio</a>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import {
  signInWithEmailAndPassword,
  onAuthStateChanged,
  GoogleAuthProvider,
  signInWithPopup,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// Correos con acceso total garantizado (developer/dueños del panel).
// Además de pasar el chequeo de Firestore, estos correos se auto-aprueban.
const ADMINS_PERMITIDOS = [
  "saanty086@gmail.com",
  "lifebag11@gmail.com"
];

const errorMsg = document.getElementById('errorMsg');
const infoMsg = document.getElementById('infoMsg');

function mostrarError(html) {
  infoMsg.style.display = "none";
  errorMsg.innerHTML = html;
  errorMsg.style.display = "block";
}

function ocultarMensajes() {
  errorMsg.style.display = "none";
  infoMsg.style.display = "none";
}

// Revisa el estado del usuario en Firestore y decide si lo deja pasar.
// Si el usuario es un admin permitido y todavía no tiene documento, se lo crea ya aprobado.
async function verificarAccesoYRedirigir(user) {
  const ref = doc(db, "usuarios", user.uid);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    if (ADMINS_PERMITIDOS.includes(user.email)) {
      await setDoc(ref, {
        email: user.email,
        estado: "aprobado",
        rol: "admin",
        creadoEn: serverTimestamp()
      });
      window.location.href = "admin.html";
      return;
    }

    await signOut(auth);
    mostrarError('Todavía no formás parte del equipo. <a href="registro.html">Registrate para entrar al equipo de Life Bag</a>.');
    return;
  }

  const datos = snap.data();

  if (datos.estado === "aprobado") {
    window.location.href = "admin.html";
    return;
  }

  if (datos.estado === "rechazado") {
    await signOut(auth);
    mostrarError('Tu acceso al panel fue rechazado. Si creés que es un error, contactá a un administrador.');
    return;
  }

  // estado === "pendiente" (o cualquier otro valor inesperado)
  await signOut(auth);
  mostrarError('Tu cuenta está pendiente de aprobación por un administrador. Te avisamos apenas se revise.');
}

// Si ya hay una sesión activa, revisar su estado antes de decidir a dónde mandarlo
onAuthStateChanged(auth, (user) => {
  if (user) {
    verificarAccesoYRedirigir(user);
  }
});

// --- Login con email y contraseña ---
const form = document.getElementById('loginForm');
const btn = document.getElementById('loginBtn');

const messages = {
  'auth/invalid-email': 'El correo ingresado no es válido.',
  'auth/user-not-found': 'No existe una cuenta con ese correo.',
  'auth/wrong-password': 'La contraseña es incorrecta.',
  'auth/invalid-credential': 'Correo o contraseña incorrectos.',
  'auth/too-many-requests': 'Demasiados intentos. Probá de nuevo en unos minutos.'
};

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  ocultarMensajes();
  btn.disabled = true;
  btn.textContent = "Ingresando...";

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    await verificarAccesoYRedirigir(cred.user);
  } catch (err) {
    console.error(err);
    mostrarError(messages[err.code] || "No se pudo iniciar sesión. Intentá de nuevo.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Ingresar";
  }
});

// --- Login con Google ---
const googleBtn = document.getElementById('googleBtn');

googleBtn.addEventListener('click', async () => {
  ocultarMensajes();
  const provider = new GoogleAuthProvider();
  try {
    const result = await signInWithPopup(auth, provider);
    await verificarAccesoYRedirigir(result.user);
  } catch (err) {
    console.error(err);
    mostrarError("No se pudo iniciar sesión con Google.");
  }
});
</script>
</body>
</html>
