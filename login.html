<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar | Panel Life Bag</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="fonts.css">



<style>
:root{
--cream:#f6f1e6; --forest:#1b4332; --forest-deep:#0f2a1f;
--rescue:#c1442c; --rescue-deep:#a8371f; --border:#e4dcc6;
--text:#23291f; --text-muted:#5c6355; --surface:#ffffff;
--radius-lg:26px; --radius-sm:10px; --shadow:0 18px 40px -18px rgba(15,42,31,0.28);
}
*{box-sizing:border-box; margin:0; padding:0; font-family:'Plus Jakarta Sans', sans-serif;}
body{
min-height:100vh; background:var(--forest);
background-image:radial-gradient(circle at 15% 15%, rgba(255,255,255,0.06), transparent 45%),
radial-gradient(circle at 85% 85%, rgba(255,255,255,0.05), transparent 45%);
display:flex; align-items:center; justify-content:center; padding:1.5rem; color:var(--text);
}
.card{
background:var(--surface); width:100%; max-width:380px;
border-radius:var(--radius-lg); padding:2.2rem 1.8rem; box-shadow:var(--shadow);
text-align:center;
}
.card img{height:56px; width:56px; margin:0 auto 0.8rem;}
h1{font-family:'Fraunces', serif; font-size:1.4rem; color:var(--forest); font-weight:700;}
p.sub{color:var(--text-muted); font-size:0.85rem; margin-top:0.35rem; margin-bottom:1.6rem;}
.form-group{margin-bottom:1rem; text-align:left;}
label{display:block; font-size:0.78rem; font-weight:700; margin-bottom:6px; color:var(--forest-deep);}
input{
width:100%; padding:0.8rem 1rem; border-radius:var(--radius-sm);
border:1.5px solid var(--border); font-size:0.94rem; outline:none;
background:var(--cream); transition:all 0.2s ease;
}
input:focus{border-color:var(--forest); background:#fff; box-shadow:0 0 0 3px rgba(27,67,50,0.12);}
button{
width:100%; background:var(--forest); color:#fff; border:none;
padding:0.9rem; border-radius:50px; font-size:0.94rem; font-weight:700;
cursor:pointer; margin-top:0.5rem; transition:background 0.2s;
}
button:hover{background:var(--forest-deep);}
button:disabled{opacity:0.65; cursor:not-allowed;}
.google-btn{
background:#fff; color:var(--forest-deep); border:1.5px solid var(--border);
display:flex; align-items:center; justify-content:center; gap:0.6rem;
}
.google-btn:hover{background:var(--cream);}
.google-btn img{height:18px; width:18px; margin:0;}
.divider{
display:flex; align-items:center; gap:0.7rem; margin:1.2rem 0;
color:var(--text-muted); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.04em;
}
.divider::before, .divider::after{content:""; flex:1; height:1px; background:var(--border);}
.error{
display:none; background:#fbe6e2; color:var(--rescue-deep); font-size:0.8rem;
padding:0.65rem 0.85rem; border-radius:var(--radius-sm); margin-bottom:1rem; font-weight:600; text-align:left;
}
.error a{color:var(--rescue-deep); text-decoration:underline;}
.info{
display:none; background:#e5efe8; color:var(--forest-deep); font-size:0.8rem;
padding:0.65rem 0.85rem; border-radius:var(--radius-sm); margin-bottom:1rem; font-weight:600; text-align:left;
}
.back{display:inline-block; margin-top:1.4rem; font-size:0.8rem; color:var(--text-muted); text-decoration:none;}
.back:hover{color:var(--forest);}
.crear-cuenta{display:block; margin-top:0.6rem; font-size:0.8rem; color:var(--forest); text-decoration:none; font-weight:700;}
.crear-cuenta:hover{text-decoration:underline;}
</style>
<link rel="stylesheet" href="panel-ui.css">
</head>
<body class="auth-page">
<div class="card">
<img src="assets/logo.png" alt="Life Bag">
<h1>Panel interno</h1>
<p class="sub">Ingresá con tu cuenta para ver pedidos y producción.</p>

<div class="error" id="errorMsg" role="alert"></div>
<div class="info" id="infoMsg" role="status"></div>

<button type="button" id="googleBtn" class="google-btn">
<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
Ingresar con Google
</button>

<div class="divider">o con tu correo</div>

<form id="loginForm">
<div class="form-group">
<label for="email">Correo electrónico</label>
<input type="email" id="email" placeholder="admin@lifebag.com" required autocomplete="username">
</div>
<div class="form-group">
<label for="password">Contraseña</label>
<input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
</div>
<button type="submit" id="loginBtn">Ingresar</button>
</form>

<a href="registro.html" class="crear-cuenta">¿No tenés cuenta? Registrate acá</a>
<a href="index.html" class="back">← Volver al sitio</a>
</div>

<script type="module">
import { auth, db } from './firebase-config.js';
import { ADMIN_EMAILS, isAdmin, hasAccess } from './access.js';
import { signInWithEmailAndPassword, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const errorMsg = document.getElementById('errorMsg');
const infoMsg = document.getElementById('infoMsg');
const form = document.getElementById('loginForm');
const btn = document.getElementById('loginBtn');
const googleBtn = document.getElementById('googleBtn');
function mostrarError(text) {
  infoMsg.style.display = 'none';
  errorMsg.textContent = text;
  errorMsg.style.display = 'block';
}
function busy(value) {
  btn.disabled = googleBtn.disabled = value;
  btn.textContent = value ? 'Verificando acceso…' : 'Ingresar';
}
const messages = {
  'auth/invalid-email': 'El correo ingresado no es válido.',
  'auth/user-not-found': 'Correo o contraseña incorrectos.',
  'auth/wrong-password': 'Correo o contraseña incorrectos.',
  'auth/invalid-credential': 'Correo o contraseña incorrectos.',
  'auth/too-many-requests': 'Demasiados intentos. Probá de nuevo en unos minutos.',
  'auth/network-request-failed': 'No pudimos conectarnos. Revisá tu conexión e intentá de nuevo.'
};
// Un único lugar verifica el acceso: evita duplicar lecturas y redirecciones al iniciar sesión.
onAuthStateChanged(auth, async user => {
  if (!user) return;
  busy(true);
  try {
    if (ADMIN_EMAILS.includes((user.email || '').toLowerCase()) && !user.emailVerified) {
      await signOut(auth);
      mostrarError('Verificá el correo de tu cuenta de administrador o ingresá con Google usando ese mismo correo.');
      return;
    }
    const profile = isAdmin(user) ? null : (await getDoc(doc(db, 'usuarios', user.uid))).data();
    if (auth.currentUser?.uid !== user.uid) return;
    if (hasAccess(user, profile)) {
      window.location.replace('admin.html');
      return;
    }
    await signOut(auth);
    mostrarError(!profile ? 'Todavía no formás parte del equipo. Registrate con el enlace de abajo.' : profile.estado === 'rechazado' ? 'Tu solicitud fue rechazada. Contactá a un administrador.' : 'Tu cuenta está pendiente de aprobación por un administrador.');
  } catch (error) {
    console.error('Error al verificar el acceso:', error);
    await signOut(auth).catch(console.error);
    mostrarError('No pudimos verificar tu acceso. Intentá de nuevo en unos minutos.');
  } finally {
    busy(false);
  }
});
form.addEventListener('submit', async event => {
  event.preventDefault();
  if (btn.disabled) return;
  errorMsg.style.display = 'none';
  busy(true);
  try {
    await signInWithEmailAndPassword(auth, form.elements.email.value.trim(), form.elements.password.value);
  } catch (error) {
    mostrarError(messages[error.code] || 'No se pudo iniciar sesión. Intentá de nuevo.');
    busy(false);
  }
});
googleBtn.addEventListener('click', async () => {
  errorMsg.style.display = 'none';
  busy(true);
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (error) {
    mostrarError(error.code === 'auth/popup-closed-by-user' ? 'Se cerró la ventana de Google. Podés volver a intentarlo.' : 'No se pudo iniciar sesión con Google.');
    busy(false);
  }
});
</script>
</body>
</html>
