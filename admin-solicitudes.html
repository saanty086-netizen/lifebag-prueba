<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitudes y permisos | Life Bag</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="fonts.css">



<style>
:root{
--cream:#f6f1e6; --forest:#1b4332; --forest-deep:#0f2a1f;
--rescue:#c1442c; --rescue-deep:#a8371f; --border:#e4dcc6;
--text:#23291f; --text-muted:#5c6355; --surface:#ffffff;
--radius-lg:26px; --radius-sm:10px; --shadow:0 18px 40px -18px rgba(15,42,31,0.28);
}
*{box-sizing:border-box; margin:0; padding:0; font-family:'Plus Jakarta Sans', sans-serif;}
body{
min-height:100vh; background:var(--forest);
background-image:radial-gradient(circle at 15% 15%, rgba(255,255,255,0.06), transparent 45%),
radial-gradient(circle at 85% 85%, rgba(255,255,255,0.05), transparent 45%);
padding:2.5rem 1.2rem; color:var(--text);
}
.wrap{max-width:720px; margin:0 auto;}
h1{font-family:'Fraunces', serif; color:#fff; font-size:1.6rem; text-align:center;}
p.sub{color:var(--cream); opacity:0.85; text-align:center; font-size:0.85rem; margin-top:0.35rem; margin-bottom:1.6rem;}
h2{font-family:'Fraunces', serif; color:#fff; font-size:1.1rem; margin:2rem 0 0.8rem; text-align:center;}
.panel{
background:var(--surface); border-radius:var(--radius-lg);
padding:1.5rem; box-shadow:var(--shadow);
}
.fila{
display:flex; align-items:center; justify-content:space-between; gap:12px;
padding:1rem 0.3rem; border-bottom:1px solid var(--border);
flex-wrap:wrap;
}
.fila:last-child{border-bottom:none;}
.correo{font-weight:700; color:var(--forest-deep); font-size:0.9rem;}
.fecha{font-size:0.72rem; color:var(--text-muted); margin-top:2px;}
.botones{display:flex; gap:8px; flex-shrink:0;}
button{
border:none; border-radius:50px; padding:0.55rem 1rem;
font-size:0.78rem; font-weight:700; cursor:pointer;
}
.aprobar{background:var(--forest); color:#fff;}
.aprobar:hover{background:var(--forest-deep);}
.rechazar{background:#fbe6e2; color:var(--rescue-deep);}
.rechazar:hover{background:#f6d3cc;}
.eliminar{background:transparent; color:var(--rescue-deep); border:1.5px solid #f0c4bb;}
.eliminar:hover{background:#fbe6e2;}
.vacio{text-align:center; color:var(--text-muted); padding:2.5rem 0; font-size:0.85rem;}
.bloqueado{
color:#fff; text-align:center; padding-top:4rem; font-size:0.95rem;
}
.bloqueado a{color:var(--cream);}
.permisos{
display:flex; gap:14px; flex-wrap:wrap; flex-shrink:0;
}
.permiso-item{
display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--forest-deep); font-weight:600;
}
.permiso-item input{width:16px; height:16px; accent-color:var(--forest); cursor:pointer;}
.guardado{
font-size:0.7rem; color:var(--forest); font-weight:700; opacity:0; transition:opacity 0.3s;
margin-left:6px;
}
.guardado.show{opacity:1;}
</style>
<link rel="stylesheet" href="panel-ui.css">
</head>
<body class="team-page">

<div class="wrap" id="app" style="display:none;">
  <a class="back-panel" href="admin.html">← Volver al panel</a>
  <p id="teamError" class="team-error" role="alert" hidden></p>
  <h1>Equipo Life Bag</h1>
  <p class="sub">Aprobá solicitudes y asigná qué área puede editar cada persona</p>

  <h2>Solicitudes pendientes</h2>
  <div class="panel">
    <div id="listaPendientes"></div>
  </div>

  <h2>Solicitudes rechazadas</h2>
  <div class="panel"><div id="listaRechazados"></div></div>

  <h2>Usuarios aprobados</h2>
  <div class="panel">
    <div id="listaAprobados"></div>
  </div>
</div>

<div id="bloqueado" class="bloqueado" style="display:none;">
  Esta sección es solo para administradores.<br>
  <a href="login.html">← Volver a ingresar</a>
</div>

<script type="module">
import { auth, db } from './firebase-config.js';
import { ADMIN_EMAILS, isAdmin, escapeHtml } from './access.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { collection, query, where, getDocs, doc, updateDoc, deleteDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = document.getElementById('app');
const blocked = document.getElementById('bloqueado');
const errorMessage = document.getElementById('teamError');
const areas = { pedidos: 'Lista de espera', produccion: 'Producción', finanzas: 'Finanzas' };
function showError(error) {
  console.error('No se pudo actualizar el equipo:', error);
  errorMessage.hidden = false;
  errorMessage.textContent = 'No se pudo completar la operación. Revisá la conexión y los permisos e intentá de nuevo.';
}
onAuthStateChanged(auth, user => {
  app.style.display = isAdmin(user) ? 'block' : 'none';
  blocked.style.display = isAdmin(user) ? 'none' : 'block';
  if (isAdmin(user)) reload();
});
async function reload() {
  errorMessage.hidden = true;
  await Promise.all(['pendiente', 'rechazado', 'aprobado'].map(loadUsers));
}
async function loadUsers(state) {
  const target = document.getElementById({ pendiente: 'listaPendientes', rechazado: 'listaRechazados', aprobado: 'listaAprobados' }[state]);
  target.innerHTML = '<div class="vacio">Cargando…</div>';
  try {
    const result = await getDocs(query(collection(db, 'usuarios'), where('estado', '==', state)));
    if (!isAdmin(auth.currentUser)) return;
    const users = result.docs.filter(item => !ADMIN_EMAILS.includes(String(item.data().email || '').toLowerCase()));
    if (!users.length) {
      target.innerHTML = '<div class="vacio">No hay cuentas en esta sección.</div>';
      return;
    }
    target.innerHTML = users.map(item => {
      const data = item.data();
      const id = escapeHtml(item.id);
      const email = escapeHtml(data.email);
      const name = escapeHtml(data.nombre || data.email);
      const date = data.creadoEn?.toDate ? data.creadoEn.toDate().toLocaleDateString('es-AR') : '';
      const permissions = Object.entries(areas).map(([area, label]) => `<label class="permiso-item"><input type="checkbox" data-uid="${id}" data-area="${area}" ${data.permisos?.[area] === true ? 'checked' : ''}>${label}</label>`).join('');
      return `<div class="fila"><div><div class="correo">${name}</div><div class="fecha">${email}${date ? ' · ' + escapeHtml(date) : ''}</div></div><div class="${state === 'aprobado' ? 'permisos' : 'botones'}">${state === 'aprobado' ? permissions : `<button class="aprobar" data-id="${id}" data-state="aprobado">Aprobar</button>${state === 'pendiente' ? `<button class="rechazar" data-id="${id}" data-state="rechazado">Rechazar</button>` : ''}`}<button class="eliminar" data-id="${id}" data-correo="${email}">Eliminar</button></div></div>`;
    }).join('');
  } catch (error) {
    target.innerHTML = '<div class="vacio">No pudimos cargar las cuentas. <button type="button" class="retry">Reintentar</button></div>';
    target.querySelector('.retry').addEventListener('click', () => loadUsers(state));
    showError(error);
  }
}
app.addEventListener('click', async event => {
  const button = event.target.closest('button[data-id]');
  if (!button || !isAdmin(auth.currentUser)) return;
  if (button.classList.contains('eliminar') && !confirm(`¿Quitarle el acceso al panel a ${button.dataset.correo}? Su cuenta de Firebase Authentication seguirá existiendo.`)) return;
  button.disabled = true;
  try {
    const ref = doc(db, 'usuarios', button.dataset.id);
    if (button.classList.contains('eliminar')) await deleteDoc(ref);
    else await updateDoc(ref, { estado: button.dataset.state, revisadoPor: auth.currentUser.email, revisadoEn: serverTimestamp() });
    await reload();
  } catch (error) { showError(error); }
  finally { button.disabled = false; }
});
app.addEventListener('change', async event => {
  const checkbox = event.target.closest('input[data-area]');
  if (!checkbox || !isAdmin(auth.currentUser)) return;
  checkbox.disabled = true;
  errorMessage.hidden = true;
  try {
    await updateDoc(doc(db, 'usuarios', checkbox.dataset.uid), { [`permisos.${checkbox.dataset.area}`]: checkbox.checked });
  } catch (error) {
    checkbox.checked = !checkbox.checked;
    showError(error);
  } finally { checkbox.disabled = false; }
});
</script>
</body>
</html>
