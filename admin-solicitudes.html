<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitudes y permisos | Life Bag</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--cream:#f6f1e6; --forest:#1b4332; --forest-deep:#0f2a1f;
--rescue:#c1442c; --rescue-deep:#a8371f; --border:#e4dcc6;
--text:#23291f; --text-muted:#5c6355; --surface:#ffffff;
--radius-lg:26px; --radius-sm:10px; --shadow:0 18px 40px -18px rgba(15,42,31,0.28);
}
*{box-sizing:border-box; margin:0; padding:0; font-family:'Plus Jakarta Sans', sans-serif;}
body{
min-height:100vh; background:var(--forest);
background-image:radial-gradient(circle at 15% 15%, rgba(255,255,255,0.06), transparent 45%),
radial-gradient(circle at 85% 85%, rgba(255,255,255,0.05), transparent 45%);
padding:2.5rem 1.2rem; color:var(--text);
}
.wrap{max-width:720px; margin:0 auto;}
h1{font-family:'Fraunces', serif; color:#fff; font-size:1.6rem; text-align:center;}
p.sub{color:var(--cream); opacity:0.85; text-align:center; font-size:0.85rem; margin-top:0.35rem; margin-bottom:1.6rem;}
h2{font-family:'Fraunces', serif; color:#fff; font-size:1.1rem; margin:2rem 0 0.8rem; text-align:center;}
.panel{
background:var(--surface); border-radius:var(--radius-lg);
padding:1.5rem; box-shadow:var(--shadow);
}
.fila{
display:flex; align-items:center; justify-content:space-between; gap:12px;
padding:1rem 0.3rem; border-bottom:1px solid var(--border);
flex-wrap:wrap;
}
.fila:last-child{border-bottom:none;}
.correo{font-weight:700; color:var(--forest-deep); font-size:0.9rem;}
.fecha{font-size:0.72rem; color:var(--text-muted); margin-top:2px;}
.botones{display:flex; gap:8px; flex-shrink:0;}
button{
border:none; border-radius:50px; padding:0.55rem 1rem;
font-size:0.78rem; font-weight:700; cursor:pointer;
}
.aprobar{background:var(--forest); color:#fff;}
.aprobar:hover{background:var(--forest-deep);}
.rechazar{background:#fbe6e2; color:var(--rescue-deep);}
.rechazar:hover{background:#f6d3cc;}
.eliminar{background:transparent; color:var(--rescue-deep); border:1.5px solid #f0c4bb;}
.eliminar:hover{background:#fbe6e2;}
.vacio{text-align:center; color:var(--text-muted); padding:2.5rem 0; font-size:0.85rem;}
.bloqueado{
color:#fff; text-align:center; padding-top:4rem; font-size:0.95rem;
}
.bloqueado a{color:var(--cream);}
.permisos{
display:flex; gap:14px; flex-wrap:wrap; flex-shrink:0;
}
.permiso-item{
display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--forest-deep); font-weight:600;
}
.permiso-item input{width:16px; height:16px; accent-color:var(--forest); cursor:pointer;}
.guardado{
font-size:0.7rem; color:var(--forest); font-weight:700; opacity:0; transition:opacity 0.3s;
margin-left:6px;
}
.guardado.show{opacity:1;}
</style>
</head>
<body>

<div class="wrap" id="app" style="display:none;">
  <h1>Equipo Life Bag</h1>
  <p class="sub">Aprobá solicitudes y asigná qué área puede editar cada persona</p>

  <h2>Solicitudes pendientes</h2>
  <div class="panel">
    <div id="listaPendientes"></div>
  </div>

  <h2>Usuarios aprobados</h2>
  <div class="panel">
    <div id="listaAprobados"></div>
  </div>
</div>

<div id="bloqueado" class="bloqueado" style="display:none;">
  Esta sección es solo para administradores.<br>
  <a href="login">← Volver a ingresar</a>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  collection,
  query,
  where,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// Solo estas cuentas pueden aprobar, rechazar y asignar permisos
const ADMINS = ["saanty086@gmail.com", "lifebag11@gmail.com"];

// Áreas disponibles: clave interna -> etiqueta visible
const AREAS = {
  pedidos: "Lista de espera",
  produccion: "Producción",
  finanzas: "Finanzas"
};

const app = document.getElementById('app');
const bloqueado = document.getElementById('bloqueado');
const listaPendientes = document.getElementById('listaPendientes');
const listaAprobados = document.getElementById('listaAprobados');

onAuthStateChanged(auth, (user) => {
  if (!user || !ADMINS.includes(user.email)) {
    bloqueado.style.display = "block";
    return;
  }
  app.style.display = "block";
  cargarPendientes();
  cargarAprobados();
});

// ---------- Pendientes ----------
async function cargarPendientes() {
  listaPendientes.innerHTML = '<div class="vacio">Cargando...</div>';

  const q = query(collection(db, "usuarios"), where("estado", "==", "pendiente"));
  const snap = await getDocs(q);

  if (snap.empty) {
    listaPendientes.innerHTML = '<div class="vacio">No hay solicitudes pendientes.</div>';
    return;
  }

  listaPendientes.innerHTML = '';
  snap.forEach((docSnap) => {
    const data = docSnap.data();
    const fecha = data.creadoEn ? data.creadoEn.toDate().toLocaleDateString('es-AR') : '';

    const fila = document.createElement('div');
    fila.className = 'fila';
    fila.innerHTML = `
      <div>
        <div class="correo">${data.nombre || data.email}</div>
        <div class="fecha">${data.nombre ? data.email + ' · ' : ''}${fecha}</div>
      </div>
      <div class="botones">
        <button class="aprobar" data-id="${docSnap.id}">Aprobar</button>
        <button class="rechazar" data-id="${docSnap.id}">Rechazar</button>
        <button class="eliminar" data-id="${docSnap.id}" data-correo="${data.email}">Eliminar</button>
      </div>
    `;
    listaPendientes.appendChild(fila);
  });

  listaPendientes.querySelectorAll('.aprobar').forEach(btn => {
    btn.addEventListener('click', () => cambiarEstado(btn.dataset.id, 'aprobado'));
  });
  listaPendientes.querySelectorAll('.rechazar').forEach(btn => {
    btn.addEventListener('click', () => cambiarEstado(btn.dataset.id, 'rechazado'));
  });
  listaPendientes.querySelectorAll('.eliminar').forEach(btn => {
    btn.addEventListener('click', () => eliminarUsuario(btn.dataset.id, btn.dataset.correo, cargarPendientes));
  });
}

async function cambiarEstado(uid, estado) {
  await updateDoc(doc(db, "usuarios", uid), {
    estado: estado,
    revisadoPor: auth.currentUser.email,
    revisadoEn: serverTimestamp()
  });
  cargarPendientes();
  cargarAprobados();
}

// ---------- Aprobados: asignar permisos por área ----------
async function cargarAprobados() {
  listaAprobados.innerHTML = '<div class="vacio">Cargando...</div>';

  const q = query(collection(db, "usuarios"), where("estado", "==", "aprobado"));
  const snap = await getDocs(q);

  // No mostramos a los admins acá: ya tienen acceso total a todo
  const usuarios = snap.docs.filter(d => !ADMINS.includes(d.data().email));

  if (usuarios.length === 0) {
    listaAprobados.innerHTML = '<div class="vacio">Todavía no hay usuarios aprobados (aparte de los administradores).</div>';
    return;
  }

  listaAprobados.innerHTML = '';
  usuarios.forEach((docSnap) => {
    const data = docSnap.data();
    const permisos = data.permisos || {};

    const fila = document.createElement('div');
    fila.className = 'fila';

    const checkboxesHtml = Object.entries(AREAS).map(([clave, etiqueta]) => `
      <label class="permiso-item">
        <input type="checkbox" data-uid="${docSnap.id}" data-area="${clave}" ${permisos[clave] ? 'checked' : ''}>
        ${etiqueta}
      </label>
    `).join('');

    fila.innerHTML = `
      <div>
        <div class="correo">${data.nombre || data.email}</div>
        <div class="fecha">${data.nombre ? data.email : ''}</div>
      </div>
      <div class="permisos">
        ${checkboxesHtml}
        <span class="guardado" data-guardado-de="${docSnap.id}">Guardado ✓</span>
        <button class="eliminar" data-id="${docSnap.id}" data-correo="${data.email}">Eliminar</button>
      </div>
    `;
    listaAprobados.appendChild(fila);
  });

  listaAprobados.querySelectorAll('.eliminar').forEach(btn => {
    btn.addEventListener('click', () => eliminarUsuario(btn.dataset.id, btn.dataset.correo, cargarAprobados));
  });

  listaAprobados.querySelectorAll('input[type="checkbox"]').forEach(chk => {
    chk.addEventListener('change', async () => {
      const uid = chk.dataset.uid;
      const area = chk.dataset.area;
      await updateDoc(doc(db, "usuarios", uid), {
        [`permisos.${area}`]: chk.checked
      });

      const aviso = listaAprobados.querySelector(`[data-guardado-de="${uid}"]`);
      if (aviso) {
        aviso.classList.add('show');
        setTimeout(() => aviso.classList.remove('show'), 1500);
      }
    });
  });
}

// ---------- Eliminar usuario (pendiente o aprobado) ----------
async function eliminarUsuario(uid, correo, recargar) {
  const confirmado = confirm(
    `¿Eliminar a ${correo}?\n\nEsto le saca el acceso al panel de inmediato (ya no va a poder entrar). Su cuenta de acceso (usuario/contraseña o Google) sigue existiendo en Firebase Authentication; si querés borrarla por completo, hacelo aparte desde Firebase Console → Authentication → Users.`
  );
  if (!confirmado) return;

  await deleteDoc(doc(db, "usuarios", uid));
  recargar();
}
</script>
</body>
</html>
